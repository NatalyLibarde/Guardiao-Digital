<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardião Digital · IA Assistente</title>
  <meta name="description" content="Plataforma de controle parental com assistente IA para ajudar os pais a protegerem seus filhos no ambiente digital.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0a1f33 0%, #1c4b6e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .container {
      max-width: 980px;
      width: 100%;
      background: #eef6fd;
      background: linear-gradient(145deg, #eef6fd 0%, #d6e6f5 100%);
      border-radius: 3.5rem;
      padding: 2.2rem 2rem;
      box-shadow: 0 25px 45px rgba(0, 10, 25, 0.6), 0 0 0 2px #3d7ca3 inset;
      border: 1px solid #8bbde0;
      transition: all 0.3s ease;
    }

    /* ===== LOGIN ===== */
    .login-area { display: block; }
    .login-area.hidden { display: none; }

    .logo-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 0.5rem;
    }

    .logo-area i {
      font-size: 2.8rem;
      color: #1a4f78;
      background: white;
      padding: 0.5rem;
      border-radius: 60%;
      box-shadow: 0 4px 8px rgba(0,30,60,0.2);
    }

    .logo-area h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #0b3857, #1f6d9e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }

    .subtitulo {
      text-align: center;
      color: #1b4a6a;
      font-weight: 500;
      margin-bottom: 1.8rem;
      font-size: 0.95rem;
      border-bottom: 2px solid #b0cfe3;
      padding-bottom: 0.8rem;
    }

    .subtitulo i { margin-right: 0.4rem; color: #ca9f2b; }

    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      margin-bottom: 1.8rem;
    }

    .step-indicator .step {
      background: #b8d2e7;
      color: #1a3b55;
      padding: 0.25rem 1rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 700;
      border: 1px solid #6893b5;
    }

    .step-indicator .step.active {
      background: #1a5b84;
      color: white;
      border-color: #f5c542;
      box-shadow: 0 2px 0 #0d3149;
    }

    .form-group { margin-bottom: 1.2rem; }

    .input-group {
      display: flex;
      align-items: center;
      background: white;
      padding: 0.2rem 0.2rem 0.2rem 1.5rem;
      border-radius: 60px;
      border: 1px solid #6f9fc7;
      box-shadow: 0 4px 10px rgba(0, 20, 40, 0.12);
      transition: 0.15s;
    }

    .input-group:focus-within {
      border-color: #f5c542;
      box-shadow: 0 0 0 3px rgba(245, 197, 66, 0.3);
    }

    .input-group i {
      color: #1d5d87;
      font-size: 1.2rem;
      width: 1.8rem;
      text-align: center;
    }

    .input-group input {
      flex: 1;
      border: none;
      outline: none;
      padding: 0.9rem 0.2rem;
      font-size: 1rem;
      background: transparent;
      color: #0a2d46;
      font-weight: 500;
    }

    .input-group input::placeholder {
      color: #96b5cf;
      font-weight: 400;
    }

    .input-group .btn-aux {
      background: #e0edf7;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: 600;
      color: #1a4f78;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.15s;
      border: 1px solid #aac3d9;
      margin-right: 0.2rem;
    }

    .input-group .btn-aux:hover { background: #c7dcee; }

    .btn-azul {
      background: #1a5b84;
      border: none;
      padding: 0.9rem 1.8rem;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.05rem;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid #f5c542;
      box-shadow: 0 4px 0 #0d3149;
      width: 100%;
      margin-top: 0.4rem;
    }

    .btn-azul:hover {
      background: #2773a3;
      transform: scale(1.01);
      box-shadow: 0 6px 0 #0d3149;
    }

    .btn-azul:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0d3149;
    }

    .btn-gov {
      background: #15415e;
      border: 1px solid #8bbde0;
      padding: 0.7rem 1.2rem;
      border-radius: 60px;
      font-weight: 600;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.15s;
      width: 100%;
      margin-top: 0.6rem;
      border: 1px solid #f5c542;
      box-shadow: 0 3px 0 #0a2639;
    }

    .btn-gov:hover { background: #1f5f83; transform: scale(1.01); }
    .btn-gov:active { transform: translateY(3px); box-shadow: 0 1px 0 #0a2639; }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1rem 0;
      color: #3e6a89;
      font-weight: 500;
    }

    .divider hr { flex: 1; border: none; border-top: 2px dashed #b0cfe3; }

    .codigo-area {
      background: #dce8f3;
      border-radius: 3rem;
      padding: 0.8rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      margin: 0.8rem 0;
      border: 1px solid #7dafd1;
    }

    .codigo-area span { font-weight: 600; color: #0b3857; }

    .codigo-area .btn-enviar {
      background: #1a5b84;
      border: none;
      padding: 0.4rem 1.4rem;
      border-radius: 60px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #f5c542;
      transition: 0.15s;
    }

    .codigo-area .btn-enviar:hover { background: #2773a3; }

    .erro-msg {
      color: #b13e3e;
      background: #ffebeb;
      border-radius: 50px;
      padding: 0.5rem 1.5rem;
      margin-top: 0.6rem;
      font-weight: 600;
      border-left: 6px solid #b13e3e;
      display: none;
    }

    .erro-msg.visible { display: block; }

    /* ===== PAINEL PARENTAL ===== */
    .painel-area { display: none; }
    .painel-area.visible { display: block; }

    .header-painel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.8rem;
      padding-bottom: 0.8rem;
      border-bottom: 3px solid #1f6290;
    }

    .badge-seguro {
      background: #15415e;
      color: #f5e56b;
      padding: 0.4rem 1.2rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.8rem;
      border: 1px solid #f6c542;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .badge-seguro i { color: #f5d742; }

    /* ===== IA ASSISTENTE ===== */
    .ia-assistente {
      background: linear-gradient(135deg, #1a4f78, #2a7ab3);
      border-radius: 2rem;
      padding: 1.2rem 1.8rem;
      margin-bottom: 1.5rem;
      border: 2px solid #f5c542;
      box-shadow: 0 4px 15px rgba(26, 91, 132, 0.3);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .ia-assistente .ia-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: white;
    }

    .ia-assistente .ia-info i {
      font-size: 2.2rem;
      background: rgba(255,255,255,0.2);
      padding: 0.5rem;
      border-radius: 60%;
      animation: pulse-ia 2s infinite;
    }

    @keyframes pulse-ia {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .ia-assistente .ia-info h4 {
      font-size: 1rem;
      font-weight: 700;
    }

    .ia-assistente .ia-info p {
      font-size: 0.8rem;
      opacity: 0.9;
    }

    .ia-assistente .ia-chat-toggle {
      background: white;
      border: none;
      padding: 0.5rem 1.5rem;
      border-radius: 60px;
      font-weight: 700;
      color: #1a4f78;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid #f5c542;
    }

    .ia-assistente .ia-chat-toggle:hover {
      background: #f5faff;
      transform: scale(1.02);
    }

    /* Chat da IA */
    .ia-chat-container {
      background: white;
      border-radius: 1.5rem;
      border: 2px solid #7dafd1;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      margin-bottom: 1.5rem;
      overflow: hidden;
      display: none;
      max-height: 450px;
      flex-direction: column;
    }

    .ia-chat-container.ativo {
      display: flex;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ia-chat-header {
      background: linear-gradient(135deg, #0b3857, #1a5b84);
      color: white;
      padding: 0.8rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ia-chat-header h5 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
    }

    .ia-chat-header .fechar-chat {
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0.8;
    }

    .ia-chat-header .fechar-chat:hover { opacity: 1; }

    .ia-chat-messages {
      padding: 1rem 1.5rem;
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      background: #f8fbff;
    }

    .ia-msg {
      max-width: 85%;
      padding: 0.7rem 1.2rem;
      border-radius: 1.2rem;
      font-size: 0.9rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .ia-msg.bot {
      background: #e9f2fa;
      color: #0b3857;
      align-self: flex-start;
      border-bottom-left-radius: 0.3rem;
      border: 1px solid #d0e0ed;
    }

    .ia-msg.user {
      background: #1a5b84;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 0.3rem;
    }

    .ia-msg .msg-time {
      font-size: 0.6rem;
      opacity: 0.6;
      margin-top: 0.2rem;
      display: block;
    }

    .ia-chat-input {
      display: flex;
      padding: 0.8rem 1.2rem;
      border-top: 1px solid #d0e0ed;
      background: #f5faff;
      gap: 0.5rem;
    }

    .ia-chat-input input {
      flex: 1;
      border: 1px solid #b0cfe3;
      border-radius: 60px;
      padding: 0.6rem 1.2rem;
      outline: none;
      font-size: 0.9rem;
    }

    .ia-chat-input input:focus {
      border-color: #f5c542;
      box-shadow: 0 0 0 3px rgba(245, 197, 66, 0.2);
    }

    .ia-chat-input button {
      background: #1a5b84;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid #f5c542;
    }

    .ia-chat-input button:hover { background: #2773a3; }

    .ia-sugestoes {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.3rem 1.2rem 0.8rem;
      background: #f5faff;
      border-top: 1px solid #e0eaf2;
    }

    .ia-sugestoes button {
      background: #e9f2fa;
      border: 1px solid #b0cfe3;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      font-size: 0.7rem;
      color: #1a4a6a;
      cursor: pointer;
      transition: 0.15s;
    }

    .ia-sugestoes button:hover {
      background: #d0e0ed;
      border-color: #7dafd1;
    }

    /* ===== INFO CARDS ===== */
    .info-card {
      background: white;
      border-radius: 2rem;
      padding: 1.5rem 1.8rem;
      margin-bottom: 1.5rem;
      border: 1px solid #7dafd1;
      box-shadow: 0 4px 0 #abc6dd;
    }

    .info-card h3 {
      color: #0b3857;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.1rem;
      margin-bottom: 0.8rem;
    }

    .info-card h3 i { color: #ca9f2b; }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .campo label {
      font-weight: 600;
      color: #1a4a6a;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .campo input, .campo select {
      padding: 0.7rem 1rem;
      border-radius: 60px;
      border: 1px solid #b0cfe3;
      background: #f5faff;
      font-weight: 500;
      color: #0a2d46;
      transition: 0.15s;
      outline: none;
      width: 100%;
    }

    .campo input:focus, .campo select:focus {
      border-color: #f5c542;
      box-shadow: 0 0 0 3px rgba(245, 197, 66, 0.3);
    }

    .btn-acao {
      background: #1a5b84;
      border: none;
      padding: 0.7rem 1.6rem;
      border-radius: 60px;
      font-weight: 700;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid #f5c542;
      box-shadow: 0 3px 0 #0d3149;
      font-size: 0.95rem;
    }

    .btn-acao:hover {
      background: #2773a3;
      transform: scale(1.01);
      box-shadow: 0 5px 0 #0d3149;
    }

    .btn-acao:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0d3149;
    }

    .btn-acao.secundario {
      background: #b0cfe3;
      color: #0b3857;
      border-color: #6f9fc7;
      box-shadow: 0 3px 0 #6f8fa8;
    }

    .btn-acao.secundario:hover { background: #c5dcee; }

    .btn-acao.verde {
      background: #1e7e34;
      border-color: #7cb342;
      box-shadow: 0 3px 0 #0f4f1f;
    }

    .btn-acao.verde:hover { background: #2a9d47; }

    .btn-acao.vermelho {
      background: #b13e3e;
      border-color: #8b2f2f;
      box-shadow: 0 3px 0 #6f2020;
    }

    .btn-acao.vermelho:hover { background: #c94a4a; }

    /* Filho item */
    .filho-item {
      background: #e9f2fa;
      border-radius: 1.5rem;
      padding: 0.8rem 1.4rem;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 0.8rem;
      border: 1px solid #b0cfe3;
      transition: 0.2s;
    }

    .filho-item:hover {
      border-color: #1f6290;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .filho-item .info-filho {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex: 1;
      min-width: 140px;
    }

    .filho-item .info-filho i {
      font-size: 1.6rem;
      color: #1a5b84;
    }

    .filho-item .info-filho .detalhes {
      display: flex;
      flex-direction: column;
    }

    .filho-item .info-filho .detalhes .nome-idade {
      font-weight: 600;
      color: #0b3857;
    }

    .filho-item .info-filho .detalhes .nome-idade small {
      font-weight: 400;
      color: #1a4a6a;
      font-size: 0.8rem;
    }

    .filho-item .status {
      font-weight: 600;
      font-size: 0.75rem;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      white-space: nowrap;
    }

    .status.conectado { background: #1e7e34; color: white; }
    .status.desconectado { background: #b0b0b0; color: #333; }
    .status.pendente { background: #f5c542; color: #1a3b55; }
    .status.bloqueado { background: #b13e3e; color: white; }

    .classificacao-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.15rem 0.8rem;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.7rem;
    }

    .classificacao-livre { background: #4caf50; color: white; }
    .classificacao-10 { background: #8bc34a; color: #1a3b55; }
    .classificacao-12 { background: #ffeb3b; color: #1a3b55; }
    .classificacao-14 { background: #ff9800; color: white; }
    .classificacao-16 { background: #f44336; color: white; }
    .classificacao-18 { background: #9c27b0; color: white; }
    .classificacao-restrito { background: #b13e3e; color: white; }

    .monitoramento-dados {
      width: 100%;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px dashed #b0cfe3;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      font-size: 0.8rem;
      color: #1a4a6a;
    }

    .monitoramento-dados span {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: #f5faff;
      padding: 0.15rem 0.8rem;
      border-radius: 30px;
      border: 1px solid #d0e0ed;
    }

    .monitoramento-dados i { color: #1a5b84; font-size: 0.85rem; }
    .monitoramento-dados .dado-destaque {
      background: #dce8f3;
      font-weight: 600;
      border-color: #7dafd1;
    }

    .monitoramento-dados .jogo-item {
      background: #e9f2fa;
      border: 1px solid #b0cfe3;
      padding: 0.1rem 0.6rem;
      border-radius: 20px;
      font-size: 0.7rem;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      flex-wrap: wrap;
    }

    .btn-pequeno {
      background: #1a5b84;
      border: none;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.65rem;
      border: 1px solid #f5c542;
      transition: 0.15s;
    }

    .btn-pequeno:hover { background: #2773a3; }
    .btn-pequeno.danger { background: #b13e3e; border-color: #8b2f2f; }
    .btn-pequeno.danger:hover { background: #c94a4a; }
    .btn-pequeno.verde { background: #1e7e34; border-color: #4caf50; }
    .btn-pequeno.verde:hover { background: #2a9d47; }
    .btn-pequeno.bloqueio { background: #ff9800; border-color: #e68900; }
    .btn-pequeno.bloqueio:hover { background: #ffab2e; }
    .btn-pequeno.liberar { background: #4caf50; border-color: #388e3c; }
    .btn-pequeno.liberar:hover { background: #66bb6a; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal-overlay.ativo { display: flex; }

    .modal-box {
      background: #eef6fd;
      max-width: 520px;
      width: 90%;
      padding: 2rem;
      border-radius: 3rem;
      border: 2px solid #3d7ca3;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-box h3 {
      color: #0b3857;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }

    .modal-box .botoes-modal {
      display: flex;
      gap: 0.8rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .footer-painel {
      margin-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem;
      padding-top: 0.8rem;
      border-top: 2px solid #b0cfe3;
